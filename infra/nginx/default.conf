# DSM 리버스 프록시 뒤에서 동작. TLS는 DSM이 종료하므로 여기서는 80만 listen.

upstream web { server web:3000; }
upstream api { server api:8080; }

# DSM 리버스 프록시가 넘겨주는 X-Forwarded-For에서 실제 클라이언트 IP 복원
# (아래 /admin IP 제한을 쓸 때 필요. DSM 리버스 프록시 → "사용자 지정 헤더"에서
#  X-Forwarded-For / X-Forwarded-Proto 전달이 켜져 있는지 확인)
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;          # STT 오디오 업로드 상한

    proxy_http_version 1.1;

    # 주의: proxy_set_header 는 location 에 하나라도 있으면 server 레벨 것을 "전부" 상속하지 않는다(nginx 규칙).
    # 공통 헤더를 각 location 안에 반복한다. 빠지면 Host=upstream 이름, X-Forwarded-Proto 소실 →
    # Spring 이 OAuth redirect_uri 를 http://api:8080/... 로 만들어 소셜 로그인이 깨진다 (T-015).
    # X-Forwarded-Proto https 고정: 항상 DSM(TLS) 뒤에 있다.

    # ---- Spring Boot API (context-path /api) ----
    # SSE 스트리밍(채팅 응답) 때문에 버퍼링 off, 타임아웃 넉넉히.
    location /api/ {
        proxy_pass http://api;         # 뒤에 / 없음 → /api/... 경로 그대로 전달
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    # ---- 어드민 (Next.js route group) ----
    # 홈 네트워크/Tailscale에서만 접근 허용하려면 주석 해제.
    # X-Forwarded-For가 안 넘어오면 본인도 막히니 먼저 $remote_addr 로그로 확인할 것.
    # location ^~ /admin {
    #     allow 192.168.0.0/16;
    #     allow 100.64.0.0/10;       # Tailscale
    #     deny  all;
    #     proxy_pass http://web;
    # }
    # location ^~ /api/admin/ {
    #     allow 192.168.0.0/16;
    #     allow 100.64.0.0/10;
    #     deny  all;
    #     proxy_pass http://api;
    #     proxy_read_timeout 300s;
    #     # 주석 해제 시 위 /api/ 의 proxy_set_header 5줄도 같이 복사할 것
    # }

    # ---- Next.js ----
    location / {
        proxy_pass http://web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade    $http_upgrade;   # dev HMR/향후 WS 대비
        proxy_set_header Connection "upgrade";
    }
}
