# 로컬 개발용 nginx. 운영과 같은 구조로 :3000 을 잡고 next dev(:3001) / api(:8080) 로 나눈다.
# Next rewrite 로 /api 를 프록시하면 SSE 가 0바이트로 도착한다(Homepage X21) — 그래서 로컬도 nginx.
# host.docker.internal = Docker Desktop(Mac/Windows)에서 호스트. Linux 는 extra_hosts 로 매핑(compose 참고).

upstream web_dev { server host.docker.internal:3001; }
upstream api_dev { server host.docker.internal:8080; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-Host  $host;

    location /api/ {
        proxy_pass http://api_dev;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Connection "";
        add_header X-Accel-Buffering no;
    }

    # next dev 는 HMR 용 WebSocket 을 쓴다
    location / {
        proxy_pass http://web_dev;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
