# NAS 배포용 compose. 실행 위치: NAS의 배포 디렉토리(infra/ 내용이 그대로 복사됨)
#   docker compose --env-file .env up -d
#
# 네트워크 구조
#   인터넷 → DSM 리버스 프록시(TLS 종료, chat.example.com → localhost:8080)
#          → nginx(8080) → web(3000) / api(8080)
#   api → mysql(3306)
#   api → 외부 AI 직접 호출 (D-044): LLM = Claude(롤백 Gemini), STT = Groq, TTS = Azure Speech. 키는 전부 .env

name: ${APP_NAME:-talking-behind-my-back}

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"                    # DSM 리버스 프록시 대상 포트
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

  web:
    image: ghcr.io/${GH_OWNER}/${APP_NAME}-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8080/api   # 서버 컴포넌트/route handler에서 API 호출 시
    depends_on:
      - api

  api:
    image: ghcr.io/${GH_OWNER}/${APP_NAME}-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env                     # OAuth 키, JWT, AI 공급자 키(Anthropic·Groq·Azure·Gemini) 등 (.env.example 참고, D-044)
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
      # NAS 메모리에 맞춰 조정. 4GB NAS면 768m, 8GB 이상이면 1g~1.5g
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx768m -Djava.security.egd=file:/dev/./urandom"
      # characterEncoding 은 Java charset 이름(UTF-8). utf8mb4 를 넣으면 Connector/J 가 기동 시 죽는다.
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    tmpfs:
      # STT 업로드 임시 파일 — 디스크에 남기지 않음. tmpfs 는 Dockerfile 의 chown 을 덮어써 root 소유가 되고 spring 유저가
      # 못 쓴다(T-012 NAS 실측). mode= 는 이미지에 디렉터리가 있으면 무시되므로 uid/gid 로 소유자 지정 — Dockerfile 의 spring(100:101)
      - /tmp/audio:size=256m,uid=100,gid=101
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=256M   # NAS 메모리 고려
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - ${DATA_DIR}/mysql:/var/lib/mysql             # bind mount → Hyper Backup 대상에 포함 가능
      - ./mysql/init:/docker-entrypoint-initdb.d:ro  # 최초 1회 DB 레벨 설정 (테이블은 Flyway 가 생성)
    # ports:
    #   - "3306:3306"                  # 로컬 DB 툴로 붙을 때만 임시로 열기
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s              # NAS HDD 에서 첫 초기화(데이터 디렉터리 생성)만 2분 이상 — 그동안 실패는 안 센다 (T-012 실측)
