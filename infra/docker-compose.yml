# NAS 배포용 compose. 실행 위치: NAS의 배포 디렉토리(infra/ 내용이 그대로 복사됨)
#   docker compose --env-file .env up -d
#
# 네트워크 구조
#   인터넷 → DSM 리버스 프록시(TLS 종료, chat.example.com → localhost:8080)
#          → nginx(8080) → web(3000) / api(8080)
#   api → omniroute(20128) → 외부 LLM 공급자
#   api → mysql(3306)
#   api → STT/TTS: OmniRoute /v1/audio/* 경유 (D-027). STT = Groq(OmniRoute 대시보드 키), TTS = edge-tts 사이드카(D-028) / Clova 는 스텁

name: ${APP_NAME:-talking-behind-my-back}

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"                    # DSM 리버스 프록시 대상 포트
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

  web:
    image: ghcr.io/${GH_OWNER}/${APP_NAME}-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8080/api   # 서버 컴포넌트/route handler에서 API 호출 시
    depends_on:
      - api

  api:
    image: ghcr.io/${GH_OWNER}/${APP_NAME}-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env                     # OAuth 키, JWT, STT/TTS 모델명 등 (.env.example 참고). 공급자 키는 OmniRoute 대시보드에(D-027)
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
      # NAS 메모리에 맞춰 조정. 4GB NAS면 768m, 8GB 이상이면 1g~1.5g
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx768m -Djava.security.egd=file:/dev/./urandom"
      # characterEncoding 은 Java charset 이름(UTF-8). utf8mb4 를 넣으면 Connector/J 가 기동 시 죽는다.
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      OMNIROUTE_BASE_URL: http://omniroute:20128/v1
    tmpfs:
      # STT 업로드 임시 파일 — 디스크에 남기지 않음. tmpfs 는 root:root 755 로 마운트돼 Dockerfile 의 chown 을 덮어쓰고
      # spring 유저가 못 쓴다(T-012 NAS 실측: Permission denied) → /tmp 처럼 sticky 1777
      - /tmp/audio:size=256m,mode=1777
    depends_on:
      mysql:
        condition: service_healthy
      omniroute:
        condition: service_started

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=256M   # NAS 메모리 고려
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - ${DATA_DIR}/mysql:/var/lib/mysql             # bind mount → Hyper Backup 대상에 포함 가능
      - ./mysql/init:/docker-entrypoint-initdb.d:ro  # 최초 1회 DB 레벨 설정 (테이블은 Flyway 가 생성)
    # ports:
    #   - "3306:3306"                  # 로컬 DB 툴로 붙을 때만 임시로 열기
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s              # NAS HDD 에서 첫 초기화(데이터 디렉터리 생성)만 2분 이상 — 그동안 실패는 안 센다 (T-012 실측)

  omniroute:
    image: diegosouzapw/omniroute:latest
    restart: unless-stopped
    stop_grace_period: 40s
    ports:
      - "20128:20128"                  # 대시보드. LAN 전용 — 공유기 포트포워딩/DSM 리버스 프록시 등록 금지
    env_file: .env.omniroute
    volumes:
      - ${DATA_DIR}/omniroute:/app/data
    depends_on:
      - edge-tts

  # TTS 사이드카 (D-028): Edge "Read Aloud" 음성을 OpenAI 호환 API 로. OmniRoute 에 "OpenAI 호환" 공급자
  # (http://edge-tts:5050/v1)로 등록. 호스트 포트 없음. 비공식 API 라 MS 가 막으면 OmniRoute 콤보 폴백(gtts/ko)으로.
  edge-tts:
    image: travisvn/openai-edge-tts:latest@sha256:af8df8fb39719623cb6c3dbcba87ab65813030d97e20ae436d3161a53d41d72a   # 비공식 Edge API 의존 — digest 고정(2026-02-18 빌드). 올릴 땐 curl 로 한국어 TTS 확인 후
    restart: unless-stopped
    environment:
      PORT: 5050
      REQUIRE_API_KEY: "False"
      DEFAULT_VOICE: ko-KR-SunHiNeural
      DEFAULT_RESPONSE_FORMAT: mp3
    # NAS 메모리: 파이썬 프로세스 1개, 유휴 ~60MB
    mem_limit: 256m
