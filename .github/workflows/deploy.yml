# master 브랜치 push → 이미지 빌드/푸시(GHCR) → NAS에 infra/ 복사 → compose pull & up
#
# 필요한 GitHub 설정
#   Variables : APP_NAME, NAS_DEPLOY_DIR — 둘 다 선택. 비우면 레포명(D-010 슬러그) 기반 기본값
#               APP_NAME=<repo>, NAS_DEPLOY_DIR=/volume1/docker/<repo>. 등록 시 Repository variables 탭(Secrets 아님)
#   Secrets   : NAS_HOST, NAS_SSH_PORT, NAS_SSH_USER, NAS_SSH_KEY
#
# NAS 사전 준비
#   1. DSM → 제어판 → 터미널 및 SNMP → SSH 활성화 (포트 변경 권장)
#   2. 배포 계정 ~/.ssh/authorized_keys 에 공개키 등록
#   3. docker login ghcr.io -u <GH_OWNER> -p <read:packages PAT>  (비공개 이미지일 때)
#   4. NAS_DEPLOY_DIR 에 .env / .env.omniroute 준비 (예제 파일 참고)
#   5. Synology 는 docker.sock 이 root:root 660 이라 sudo 필요(visudo 없음):
#      sudo sh -c 'echo "<배포계정> ALL=(root) NOPASSWD: /usr/local/bin/docker" > /etc/sudoers.d/<배포계정> && chmod 440 /etc/sudoers.d/<배포계정>'
#      확인: ssh <배포계정>@NAS 'sudo -n /usr/local/bin/docker ps'

name: deploy

on:
  push:
    branches: [master]
    paths:
      - "apps/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name (GHCR는 소문자만 허용, APP_NAME 미설정 시 레포명)
        id: img
        run: |
          OWNER="${{ github.repository_owner }}"
          APP="${{ vars.APP_NAME || github.event.repository.name }}"
          echo "name=ghcr.io/${OWNER,,}/${APP,,}-${{ matrix.app }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          push: true
          # Synology x86 모델 기준. ARM 모델(realtek/armada)이면 linux/arm64 추가
          platforms: linux/amd64
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      DEPLOY_DIR: ${{ vars.NAS_DEPLOY_DIR || format('/volume1/docker/{0}', github.event.repository.name) }}
    steps:
      - name: Check required secrets (값은 출력하지 않음 — 이름만)
        env:
          NAS_HOST: ${{ secrets.NAS_HOST }}
          NAS_SSH_PORT: ${{ secrets.NAS_SSH_PORT }}
          NAS_SSH_USER: ${{ secrets.NAS_SSH_USER }}
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          missing=""
          for n in NAS_HOST NAS_SSH_PORT NAS_SSH_USER NAS_SSH_KEY; do
            [ -z "${!n}" ] && missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::비어 있는 Repository secret:$missing — Settings → Secrets and variables → Actions → Secrets 탭 → Repository secrets 에 등록(Environment secrets 는 이 job 에서 안 읽힘)"
            exit 1
          fi
          echo "secrets OK (NAS_SSH_KEY ${#NAS_SSH_KEY} chars, DEPLOY_DIR=$DEPLOY_DIR)"

      - uses: actions/checkout@v4

      - name: Copy infra/ to NAS (.env는 gitignore라 복사되지 않음)
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.NAS_HOST }}
          port: ${{ secrets.NAS_SSH_PORT }}
          username: ${{ secrets.NAS_SSH_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          source: "infra/*"
          target: ${{ env.DEPLOY_DIR }}
          strip_components: 1
          overwrite: true

      - name: Pull & restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.NAS_HOST }}
          port: ${{ secrets.NAS_SSH_PORT }}
          username: ${{ secrets.NAS_SSH_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          script: |
            set -e
            export PATH=/usr/local/bin:$PATH        # Synology 비대화형 SSH 는 /usr/local/bin(docker) 이 PATH 에 없다
            cd ${{ env.DEPLOY_DIR }}
            # IMAGE_TAG 는 .env 에 써 넣는다(.env.example 주석) — sudo 가 환경변수를 초기화해도 compose 가 읽는다
            if grep -q '^IMAGE_TAG=' .env; then sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ github.sha }}/" .env; else echo "IMAGE_TAG=${{ github.sha }}" >> .env; fi
            # Synology Docker 는 bind mount 대상 디렉터리를 자동 생성하지 않는다 ("Bind mount failed: ... does not exist")
            DATA_DIR=$(grep '^DATA_DIR=' .env | cut -d= -f2- | awk '{print $1}')
            mkdir -p "${DATA_DIR:-./data}/mysql" "${DATA_DIR:-./data}/omniroute"
            # docker.sock 이 root:root 660 이면 sudoers NOPASSWD(상단 주석 5번) 경유. 비밀번호를 요구하면 즉시 실패(-n)
            if docker ps >/dev/null 2>&1; then DOCKER=docker; else DOCKER="sudo -n docker"; fi
            $DOCKER compose --env-file .env pull web api
            $DOCKER compose --env-file .env up -d --remove-orphans
            $DOCKER image prune -f
            $DOCKER compose --env-file .env ps
