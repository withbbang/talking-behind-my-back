<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 뒷담 친구 파비콘 — 뿔·꼬리·비웃음 달린 악마 하트. Next.js App Router 가 app/icon.svg 를 자동으로 favicon 으로 서빙. -->
  <defs>
    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4D6A"/>
      <stop offset="0.55" stop-color="#E5163C"/>
      <stop offset="1" stop-color="#7A001C"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#C1002F"/>
      <stop offset="1" stop-color="#FF4D6A"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0C0A10"/>

  <!-- 악마 꼬리 (하트 아래에서 오른쪽으로 휘어 창끝) -->
  <path d="M31 53 C33 60 42 63 48 58" fill="none" stroke="#C1002F" stroke-width="3" stroke-linecap="round"/>
  <path d="M56 51 L46.5 54.5 L51.5 60.5 Z" fill="#E5163C"/>

  <!-- 하트 -->
  <path d="M32 55 C26 49 12 40 12 26 C12 18 18 13 24 13 C28 13 31 15 32 18 C33 15 36 13 40 13 C46 13 52 18 52 26 C52 40 38 49 32 55 Z" fill="url(#heart)"/>

  <!-- 뿔 -->
  <path d="M22 14.5 C16.5 12.5 13 7 15 1.5 C17.5 6.5 22 9.5 27.5 12.5 Z" fill="url(#horn)"/>
  <path d="M42 14.5 C47.5 12.5 51 7 49 1.5 C46.5 6.5 42 9.5 36.5 12.5 Z" fill="url(#horn)"/>

  <!-- 눈 (안쪽으로 내려간 화난 눈) + 비웃음 + 송곳니 -->
  <line x1="20" y1="26" x2="28" y2="30.5" stroke="#0C0A10" stroke-width="3.6" stroke-linecap="round"/>
  <line x1="44" y1="26" x2="36" y2="30.5" stroke="#0C0A10" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M23 40 Q31 46 41 37.5" fill="none" stroke="#0C0A10" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M35.5 40.2 L37.8 43.6 L38.8 39.2 Z" fill="#0C0A10"/>

  <!-- 하이라이트 -->
  <ellipse cx="20" cy="20" rx="3" ry="1.6" transform="rotate(-35 20 20)" fill="#FFFFFF" opacity="0.3"/>
</svg>
